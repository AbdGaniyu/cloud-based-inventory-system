services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gadgethub
      POSTGRES_PASSWORD: gadgethub
      POSTGRES_DB: gadgethub
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gadgethub -d gadgethub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
